name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Aviad-workPA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Aviad-workPA
          path: Aviad-workPA.apk

      - name: Publish to Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Aviad workPA – גרסה אחרונה (build ${{ github.run_number }})
          body: |
            הורד את Aviad-workPA.apk והתקן בטלפון.
            build ${{ github.run_number }} · ${{ github.sha }}
          files: Aviad-workPA.apk
          make_latest: true
